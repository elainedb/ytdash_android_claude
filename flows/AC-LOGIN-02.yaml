# AC-LOGIN-02 — non-authorized email is rejected, stays out of the app.
appId: ${APP_ID}
tags: [login, smoke]
---
- launchApp:
    clearState: true
    arguments:
      uiTestMode: true
      mockAuthEmail: ${UNAUTHORIZED_EMAIL}
      apiBaseUrl: ${MOCK_API_BASE}
      authorizedEmails: ${AUTHORIZED_EMAIL}
      captureExternalLinks: true
- extendedWaitUntil:
    visible:
      id: "login_google_button"
    timeout: 20000
- tapOn:
    id: "login_google_button"
- extendedWaitUntil:
    visible:
      id: "login_error_message"
    timeout: 20000
- assertNotVisible:
    id: "screen_home"
